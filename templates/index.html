<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .color-box {
            width: 50px;
            height: 50px;
            display: inline-block;
            border: 1px solid;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h1 class="mb-4">Upload an Image</h1>
                <form method="POST" enctype="multipart/form-data">
                    <div class="custom-file mb-3">
                        <input type="file" class="custom-file-input" id="customFile" name="file" accept="image/*" required>
                        <label class="custom-file-label" for="customFile">Choose file</label>
                    </div>
                    <div class="form-group">
                        <label for="colorCount">Number of Colors:</label>
                        <select class="form-control" id="colorCount" name="colorCount">
                            {% for i in range(1, 10) %} {# Assuming the highest possible is 10 for demonstration #}
                                <option value="{{ i }}">{{ i }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload</button>
                </form>
            </div>
        </div>
        {% if filename %}
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <h1 class="mb-4">Color Analysis Results</h1>
                <div class="row">
                    <div class="col-md-6">
                        <img src="{{ url_for('static', filename=filename) }}" alt="Uploaded Image" class="img-fluid mb-4">
                    </div>
                    <div class="col-md-6">
                        <ul class="list-unstyled">
                            {% for color in colors %}
                            <li class="media mb-3">
                                <div class="color-box mr-3" style="background-color: {{ color[1] }}"></div>
                                <div class="media-body">
                                    <h5 class="mt-0 mb-1">{{ color[0] }}</h5>
                                    {{ color[2] }} occurrences
                                </div>
                            </li>
                            {% endfor %}
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
